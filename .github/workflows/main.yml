name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inject HabitPulse Code
        run: |
          flutter create --org com.habitpulse habitpulse_app
          cd habitpulse_app

          # Cập nhật file pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: habitpulse_app
          description: HabitPulse Application
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.3
            path: ^1.9.0
            intl: ^0.19.0
            uuid: ^4.4.0
            fl_chart: ^0.68.0
          flutter:
            uses-material-design: true
          EOF

          # Ghi đè giao diện HabitPulse vào main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const HabitPulseApp());
          }

          class HabitPulseApp extends StatelessWidget {
            const HabitPulseApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'HabitPulse',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.green),
                  useMaterial3: true,
                ),
                home: const HabitHomeScreen(),
              );
            }
          }

          class HabitHomeScreen extends StatefulWidget {
            const HabitHomeScreen({super.key});

            @override
            State<HabitHomeScreen> createState() => _HabitHomeScreenState();
          }

          class _HabitHomeScreenState extends State<HabitHomeScreen> {
            int _streak = 0;

            void _checkIn() {
              setState(() {
                _streak += 1;
              });
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('🎉 Check-in thành công! Chuỗi hiện tại: $_streak ngày'),
                  backgroundColor: Colors.green,
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('HabitPulse - Theo Dõi Thói Quen', style: TextStyle(fontWeight: FontWeight.bold)),
                  backgroundColor: Colors.green.shade100,
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(20.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.local_fire_department, size: 80, color: Colors.orange),
                      const SizedBox(height: 10),
                      Text(
                        '🔥 Chuỗi điểm ổn định: $_streak ngày',
                        style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold),
                      ),
                      const SizedBox(height: 10),
                      const Text(
                        'Chế độ: Đang xây dựng (Mục tiêu 21 ngày)',
                        style: TextStyle(color: Colors.grey, fontSize: 14),
                      ),
                      const SizedBox(height: 40),
                      ElevatedButton.icon(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.green,
                          foregroundColor: Colors.white,
                          padding: const EdgeInsets.symmetric(horizontal: 32, vertical: 16),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                        onPressed: _checkIn,
                        icon: const Icon(Icons.check_circle_outline),
                        label: const Text('Điểm danh hôm nay', style: TextStyle(fontSize: 18)),
                      )
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitPulse-APK
          path: habitpulse_app/build/app/outputs/flutter-apk/app-release.apk
          
